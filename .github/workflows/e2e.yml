# Canonical E2E gate for FG Workspace (single job, no matrix).
#
# Triggers: pull requests to main and manual workflow_dispatch. Pushes to
# main run this same canonical job inside the release DAG
# (.github/workflows/publish-images.yml); there is no standalone
# push-to-main trigger in this workflow.
#
# Runs the `e2e` profile of scripts/agent-verify.sh (Playwright, chromium,
# isolated fg_e2e schema) against an isolated, health-checked PostgreSQL 16
# service container. Only the fg_e2e schema is ever reset. The job itself
# runs inside the official, version-pinned Playwright CI container
# (Chromium + system dependencies preinstalled — no per-run package or
# browser download); PostgreSQL 16 stays a separate service container on
# the job network.
#
# Artifacts (access-protected, repository readers only; uploading an
# artifact never proves gate success — see docs/agent/WORKFLOW.md):
#   * e2e-summary-<run_id>-<run_attempt> — agent-verify JSON run summary,
#     kept on success AND failure (never on cancellation), 14 days.
#   * e2e-failure-<run_id>-<run_attempt> — playwright-report/ + test-results/,
#     on E2E failure only (never on cancellation), 14 days.
name: E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs of the same PR branch only; manual dispatch
# runs are queued and never cancelled. Main-push verification runs in
# the release DAG (publish-images.yml).
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: Playwright E2E (chromium)
    runs-on: ubuntu-24.04
    # The last fully successful suite run took ~11 minutes for the test
    # execution itself (the former ~2.5-minute figure is obsolete);
    # 20 minutes covers what setup still needs (container image pull,
    # checkout, npm ci, uv sync — no per-run package or browser
    # download) and bounds hanging jobs. The budget is deliberately
    # kept, not raised.
    timeout-minutes: 20

    # Reproducible browser environment: the job runs INSIDE the official
    # Playwright CI container, pinned to the exact Playwright version of
    # the root lockfile (package-lock.json: @playwright/test 1.62.1).
    # The image bakes in Chromium (plus chromium-headless-shell) and the
    # Ubuntu system dependencies of that release, so the E2E critical
    # path performs no per-run package or browser download — the former
    # per-run Chromium/system-dependency download (~11 minutes of apt
    # traffic on the job) was the bottleneck that pushed the run past
    # its 20-minute budget. The image ships Node 24 (repo contract) and
    # git; Python 3.12 stays under the pinned setup-uv step below. The
    # image runs as root: Playwright launches Chromium without its
    # sandbox by default, and the suite only ever talks to 127.0.0.1,
    # which the official Playwright documentation endorses for trusted
    # E2E code.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # Official Playwright Docker recommendations: --init avoids PID-1
      # zombie buildup (Django + Vite + Chromium child processes);
      # --ipc=host gives Chromium the shared memory it needs instead of
      # the small container /dev/shm.
      options: --init --ipc=host

    # CI-only, non-secret PostgreSQL contract for config.settings_e2e:
    # Django connects to database "fg_workspace" as user "fg_ci" and works
    # inside the isolated fg_e2e schema (the only schema the E2E reset
    # may touch). No production credentials and no GitHub secrets.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fg_ci
          POSTGRES_PASSWORD: fg-ci-only
          POSTGRES_DB: fg_workspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fg_ci -d fg_workspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Only the environment variables settings_e2e actually requires.
      # From inside the job container the PostgreSQL service container
      # is reached by its service hostname on the job Docker network
      # (127.0.0.1 inside the job container is the container itself).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: fg_workspace
      POSTGRES_USER: fg_ci
      POSTGRES_PASSWORD: fg-ci-only

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Node.js (repo contract: .nvmrc = 24, engines >= 24)"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript dependencies (lockfile only)
        run: npm ci

      - name: "Set up uv (repo contract: requires-python >= 3.12)"
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.16
          python-version: "3.12"
          # Caches uv dependency downloads only (never virtual environment
          # state); the cache key derives from the repository lockfiles.
          enable-cache: true

      - name: Install backend dependencies (lockfile only, no lock update)
        working-directory: apps/api
        run: uv sync --frozen

      # Browser note: Chromium (the only configured browser project) is
      # preinstalled in the pinned Playwright container image — no
      # browser or system-dependency installation step remains.

      - name: Prepare E2E summary target directory
        run: mkdir -p "$RUNNER_TEMP/fg-e2e"

      # The ONLY E2E invocation in this workflow: the canonical gate.
      # The destructive-reset consent flag is set here and only here; it
      # consents to resetting the isolated fg_e2e schema in the CI database.
      - name: Run canonical E2E gate
        run: |
          FG_ALLOW_E2E_RESET=1 ./scripts/agent-verify.sh \
            --summary-json "$RUNNER_TEMP/fg-e2e/e2e-summary.json" \
            e2e

      # Runs on success AND on regular failure; skipped on cancellation so
      # a potentially incomplete summary is never uploaded. A cancelled run
      # is never presented as success evidence. Upload errors remain visible
      # but do not replace the original E2E failure (a missing summary
      # cannot mask it either).
      - name: Upload E2E run summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fg-e2e/e2e-summary.json
          retention-days: 14
          if-no-files-found: warn

      # Failure evidence only: runs on regular failure, never on success,
      # and !cancelled() explicitly excludes cancelled runs, so a cancelled
      # run never uploads test-results as failure evidence. A missing
      # artifact path warns instead of failing, so the original test
      # failure stays the reported cause.
      - name: Upload Playwright failure artifacts
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
