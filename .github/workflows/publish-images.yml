# Canonical production image publication for FG Workspace (GHCR).
#
# A push to main starts ONE release DAG for that commit X: the canonical
# Core verification job, the canonical E2E job, the canonical Harness
# contract job, and two publication jobs. All five jobs belong to the
# SAME workflow run, so github.sha == X is the authoritative SHA for
# Core(X), E2E(X), Harness(X) and publication. There is no
# cross-workflow correlation and no completion-order race: publication
# eligibility is purely declarative through `needs`.
#
# Both publication jobs declare needs on ALL THREE gate jobs, so a
# failed, cancelled, or skipped gate prevents publication through
# native dependency semantics, regardless of which gate finishes first.
#
# The publication jobs verify nothing by themselves: they build and push
# the two immutable production images of the one revision all three
# embedded gates checked out and verified:
#
#   ghcr.io/<lowercase-owner>/<repo>-api :<40-char Git SHA>
#   ghcr.io/<lowercase-owner>/<repo>-web :<40-char Git SHA>
#
# Automatic execution is `push` to `main` ONLY. Pull requests and manual
# verification runs are handled by the standalone gate workflows
# (core.yml, e2e.yml); this workflow adds no manual trigger and is
# started by no event other than a push to main.
#
# Invariants:
#   * The exact 40-character Git commit SHA is the ONLY deployment tag.
#     No mutable tag of any kind is published.
#   * Image repository names are derived from the repository identity
#     at runtime in a Bash step that lowercases `github.repository`
#     (GitHub owner/repo may contain uppercase characters; GHCR package
#     names must not; no owner/repository is hardcoded).
#   * Authentication is the runner's GITHUB_TOKEN with the minimum
#     required permissions (contents: read, packages: write). No PAT,
#     no long-lived credential, no secret besides GITHUB_TOKEN.
#   * Platform contract: linux/amd64 — the documented VServer target
#     (deploy/compose.production.yaml). Every base image in both
#     production Dockerfiles is pinned by an immutable digest verified
#     to be a multi-platform index carrying linux/amd64.
#   * Publishing is NOT deployment: nothing here touches a server, a
#     VServer, or a Compose stack. The published references are consumed
#     later through FG_API_IMAGE / FG_WEB_IMAGE.
#
# Concurrency: the release DAG keeps the former effective main-run
# behavior of the standalone core gate: pushes to main are queued and
# never cancelled (same group shape, cancel-in-progress: false), so
# superseded commits never publish in parallel, and a re-run of one
# commit republishes the identical immutable tags (idempotent).
#
# Cache: none. Cold-cache builds are the verified contract; a GHA cache
# would additionally require actions: read/write permissions beyond the
# minimum publication envelope and is not needed for correctness.
#
# Artifacts: the registry is the publication artifact. The embedded gate
# jobs keep their standard access-protected summary/failure artifacts
# (uploading an artifact never proves gate success — see
# docs/agent/WORKFLOW.md).
name: Production image publication (GHCR)

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# Same effective main-run concurrency as the former standalone core
# gate: pushes to main are queued and never cancelled, so completed main
# evidence is preserved and superseded commits never publish in parallel.
concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core:
    name: Core verification
    # Job-level permissions narrowed to what the gate itself requires.
    # The publication envelope (packages: write) stays at the workflow
    # level, where the publication jobs inherit it.
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # The core profile runs the complete frontend and backend suites
    # (no browser, no E2E reset). The prior observed successful runtime
    # was ~19m31s, but a real GitHub-hosted run (commit ef92bda, run #59,
    # started ~19:20 UTC, cancelled ~19:51 UTC) exceeded the 30-minute
    # ceiling, so 30 minutes has been proven insufficient; 45 minutes is
    # the bounded CI budget, covering setup (checkout, npm ci, uv sync)
    # and the complete suites while still bounding hanging jobs.
    timeout-minutes: 45

    # CI-only, non-secret PostgreSQL contract for config.settings:
    # Django connects to database "fg_workspace" as user "fg_ci" and the
    # backend test suite creates and drops its own test database. No
    # production credentials and no GitHub secrets.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fg_ci
          POSTGRES_PASSWORD: fg-ci-only
          POSTGRES_DB: fg_workspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fg_ci -d fg_workspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Only the environment variables config.settings actually requires.
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: fg_workspace
      POSTGRES_USER: fg_ci
      POSTGRES_PASSWORD: fg-ci-only

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Node.js (repo contract: .nvmrc = 24, engines >= 24)"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript dependencies (lockfile only)
        run: npm ci

      - name: "Set up uv (repo contract: requires-python >= 3.12)"
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.16
          python-version: "3.12"
          # Caches uv dependency downloads only (never virtual environment
          # state); the cache key derives from the repository lockfiles.
          enable-cache: true

      - name: Install backend dependencies (lockfile only, no lock update)
        working-directory: apps/api
        run: uv sync --frozen

      # The core profile is non-browser: no Playwright browser install.

      - name: Prepare core summary target directory
        run: mkdir -p "$RUNNER_TEMP/fg-core"

      # The ONLY core invocation in this workflow: the canonical gate.
      # The real exit code of agent-verify.sh is preserved (no retries,
      # no wrapping that could hide a failed phase).
      - name: Run canonical core verification gate
        run: |
          ./scripts/agent-verify.sh \
            --summary-json "$RUNNER_TEMP/fg-core/core-summary.json" \
            core

      # Runs on success AND on regular failure; skipped on cancellation so
      # a potentially incomplete summary is never uploaded. A cancelled run
      # is never presented as success evidence. Upload errors remain visible
      # but do not replace the original core failure (a missing summary
      # cannot mask it either).
      - name: Upload core run summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fg-core/core-summary.json
          retention-days: 14
          if-no-files-found: warn

  e2e:
    name: Playwright E2E (chromium)
    # Job-level permissions narrowed to what the gate itself requires.
    # The publication envelope (packages: write) stays at the workflow
    # level, where the publication jobs inherit it.
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # Observed E2E run is ~2.5 minutes; 20 minutes covers setup
    # (checkout, npm ci, uv sync, Playwright browser install) and bounds
    # hanging jobs.
    timeout-minutes: 20

    # CI-only, non-secret PostgreSQL contract for config.settings_e2e:
    # Django connects to database "fg_workspace" as user "fg_ci" and works
    # inside the isolated fg_e2e schema (the only schema the E2E reset
    # may touch). No production credentials and no GitHub secrets.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fg_ci
          POSTGRES_PASSWORD: fg-ci-only
          POSTGRES_DB: fg_workspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fg_ci -d fg_workspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Only the environment variables settings_e2e actually requires.
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: fg_workspace
      POSTGRES_USER: fg_ci
      POSTGRES_PASSWORD: fg-ci-only

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Node.js (repo contract: .nvmrc = 24, engines >= 24)"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JavaScript dependencies (lockfile only)
        run: npm ci

      - name: "Set up uv (repo contract: requires-python >= 3.12)"
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.16
          python-version: "3.12"
          # Caches uv dependency downloads only (never virtual environment
          # state); the cache key derives from the repository lockfiles.
          enable-cache: true

      - name: Install backend dependencies (lockfile only, no lock update)
        working-directory: apps/api
        run: uv sync --frozen

      - name: Install Playwright chromium (the only configured browser project)
        run: npx playwright install --with-deps chromium

      - name: Prepare E2E summary target directory
        run: mkdir -p "$RUNNER_TEMP/fg-e2e"

      # The ONLY E2E invocation in this workflow: the canonical gate.
      # The destructive-reset consent flag is set here and only here; it
      # consents to resetting the isolated fg_e2e schema in the CI database.
      - name: Run canonical E2E gate
        run: |
          FG_ALLOW_E2E_RESET=1 ./scripts/agent-verify.sh \
            --summary-json "$RUNNER_TEMP/fg-e2e/e2e-summary.json" \
            e2e

      # Runs on success AND on regular failure; skipped on cancellation so
      # a potentially incomplete summary is never uploaded. A cancelled run
      # is never presented as success evidence. Upload errors remain visible
      # but do not replace the original E2E failure (a missing summary
      # cannot mask it either).
      - name: Upload E2E run summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fg-e2e/e2e-summary.json
          retention-days: 14
          if-no-files-found: warn

      # Failure evidence only: runs on regular failure, never on success,
      # and !cancelled() explicitly excludes cancelled runs, so a cancelled
      # run never uploads test-results as failure evidence. A missing
      # artifact path warns instead of failing, so the original test
      # failure stays the reported cause.
      - name: Upload Playwright failure artifacts
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn

  harness:
    name: Harness contracts
    # Job-level permissions narrowed to what the gate itself requires.
    # The publication envelope (packages: write) stays at the workflow
    # level, where the publication jobs inherit it.
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # The fast Harness contract suite is a clean-checkout-safe,
    # static/simulated contract pass (measured under 15 s); 10 minutes
    # covers checkout + Node setup with wide margin and bounds hanging
    # jobs. Node 24 only: no dependency installation, no database
    # service, no browser, no Docker, no artifacts.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Node.js (repo contract: .nvmrc = 24, engines >= 24)"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # The ONLY harness invocation in this workflow: the canonical fast
      # Harness contract suite (the individual suite list lives in the
      # runner, not in this file).
      - name: Run canonical Harness contract suite
        run: bash scripts/tests/harness-contracts.test.sh

  publish-api:
    name: Publish API image (full-SHA tag)
    # Publication is eligible only when ALL THREE canonical gates of
    # THIS run succeeded: Core(X) AND E2E(X) AND Harness(X). A failed,
    # cancelled, or skipped gate skips this job through native
    # dependency semantics; the completion order of the gates is
    # irrelevant.
    needs:
      - core
      - e2e
      - harness
    runs-on: ubuntu-24.04
    # Cold-cache build of the production API image (uv sync from the
    # committed lockfile inside the image) plus push; 20 minutes bounds
    # hanging jobs with wide margin.
    timeout-minutes: 20
    env:
      # The verified revision: the pushed commit of THIS release run —
      # the same revision both embedded gates checked out and verified.
      # This is the production image identity.
      FG_PUBLISH_SHA: ${{ github.sha }}
    steps:
      - name: Checkout the verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pushed commit of this run — never a default-branch HEAD
          # resolved at publication time.
          ref: ${{ github.sha }}
          persist-credentials: false

      # The checkout must not silently build another revision.
      - name: Verify the checked-out revision
        run: test "$(git rev-parse HEAD)" = "$FG_PUBLISH_SHA"

      # GHCR package names must be lowercase, but the GitHub repository
      # identity may contain uppercase characters. Derive the immutable
      # image reference at runtime in Bash (no expression-level
      # lowercasing exists; no owner/repository is hardcoded).
      # `${var,,}` is a standard bash 4+ expansion; the pinned
      # ubuntu-24.04 runners provide bash 5.x.
      - name: Derive immutable image reference
        id: image
        shell: bash
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          repository="${GH_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}-api" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The production API image: existing Dockerfile, existing build
      # context (apps/api/ — the backend image contract). The full
      # commit SHA is the only tag.
      - name: Build and push the API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:${{ env.FG_PUBLISH_SHA }}
          # BuildKit provenance attestation embedded in the published
          # image (the buildx default, kept explicit). It is signed
          # with the job's GITHUB_TOKEN and needs no extra permissions.
          provenance: true
          # Standard OCI source/revision metadata identifying the
          # originating repository and the exact published commit.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.FG_PUBLISH_SHA }}
            org.opencontainers.image.repos=${{ steps.image.outputs.name }}

      - name: Report the published reference
        env:
          PUBLISHED_IMAGE: ${{ steps.image.outputs.name }}
        run: |
          printf 'Published: %s:%s\n' "$PUBLISHED_IMAGE" "$FG_PUBLISH_SHA"

  publish-web:
    name: Publish web image (full-SHA tag)
    # Publication is eligible only when ALL THREE canonical gates of
    # THIS run succeeded: Core(X) AND E2E(X) AND Harness(X). A failed,
    # cancelled, or skipped gate skips this job through native
    # dependency semantics; the completion order of the gates is
    # irrelevant.
    needs:
      - core
      - e2e
      - harness
    runs-on: ubuntu-24.04
    # Cold-cache build of the production web image (npm ci from the
    # committed root lockfile + canonical Vite build inside the image)
    # plus push; 20 minutes bounds hanging jobs with wide margin.
    timeout-minutes: 20
    env:
      FG_PUBLISH_SHA: ${{ github.sha }}
    steps:
      - name: Checkout the verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the checked-out revision
        run: test "$(git rev-parse HEAD)" = "$FG_PUBLISH_SHA"

      - name: Derive immutable image reference
        id: image
        shell: bash
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          repository="${GH_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}-web" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The production web image: existing Dockerfile, repository-root
      # build context (the npm workspace lockfile lives at the root).
      - name: Build and push the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:${{ env.FG_PUBLISH_SHA }}
          provenance: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.FG_PUBLISH_SHA }}
            org.opencontainers.image.repos=${{ steps.image.outputs.name }}

      - name: Report the published reference
        env:
          PUBLISHED_IMAGE: ${{ steps.image.outputs.name }}
        run: |
          printf 'Published: %s:%s\n' "$PUBLISHED_IMAGE" "$FG_PUBLISH_SHA"
